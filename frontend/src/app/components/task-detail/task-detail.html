<h2 mat-dialog-title>{{ task.title }}</h2>

<mat-dialog-content>
  <dl class="details">
    <dt>Description</dt>
    <dd>{{ task.description || 'Aucune description' }}</dd>

    <dt>Statut</dt>
    <dd>{{ statusLabels[task.status] }}</dd>

    <dt>Priorité</dt>
    <dd>{{ priorityLabels[task.priority] }}</dd>

    <dt>Créée le</dt>
    <dd>{{ task.createdAt | date: 'dd/MM/yyyy HH:mm' }}</dd>
  </dl>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Fermer</button>
</mat-dialog-actions>
